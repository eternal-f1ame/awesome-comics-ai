name: update the list
# Every two weeks, with no one at the keyboard: promote published preprints and retire expired ones (refresh.py), add new papers
# from arXiv (watch.py), rebuild README.md and the site data, check every entry, and commit the result to main.
on:
  schedule:
    - cron: "17 6 1,15 * *"
  workflow_dispatch:
    inputs:
      since:
        description: "Search arXiv from this day (YYYY-MM-DD). Leave empty to start from the last run."
        required: false
        default: ""
permissions:
  contents: write
  pages: write
concurrency:
  group: update-the-list
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml pytest
      - name: Test the rules
        run: python -m pytest -q tests
      - name: Promote published preprints and retire expired ones
        run: python scripts/refresh.py | tee refresh.log
      - name: Add new papers from arXiv
        env:
          WATCH_HOLD: ${{ secrets.WATCH_HOLD }}
          SINCE: ${{ inputs.since }}
        run: python scripts/watch.py ${SINCE:+--since "$SINCE"} | tee watch.md
      - name: Rebuild README.md and the site data, and check every entry
        run: |
          python scripts/build.py
          python scripts/verify.py
      - name: Write the run summary
        run: |
          cat watch.md >> "$GITHUB_STEP_SUMMARY"
          { echo; echo "## Refresh"; echo; sed 's/^/- /' refresh.log; } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data README.md docs/papers.json
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          added=$(grep -c '^- added' watch.md || true)
          { echo "Update the list: $added new paper(s)"; echo; grep '^- added' watch.md | sed 's/\*\*//g'; echo; cat refresh.log; } > msg.txt
          git commit -q -F msg.txt
          git pull -q --rebase origin main
          git push origin HEAD:main
      - name: Rebuild the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages build request refused; the push may start one"
