# Every venue that appears in papers.yaml or not_included.yaml, with its kind and its CORE rank.
# Ranks: CORE2023 for conferences, CORE2020 (the latest CORE journal list) for journals, read on 2026-11-18 from portal.core.edu.au.
# "unranked" means the venue is not in the CORE list. scripts/policy.py turns kind and rank into the inclusion rule.
#
# kind: conference | journal | workshop | track | preprint | repository
#   workshop: a workshop held with a conference, at any rank.
#   track:    a peer-reviewed track published in an A* or A conference's proceedings (Findings, briefs, extended abstracts), not posters.

