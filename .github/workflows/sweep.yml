name: monthly refresh and arXiv sweep
on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
  pull-requests: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Promote published preprints and retire expired ones
        run: |
          python scripts/refresh.py | tee refresh.log
          python scripts/build.py
      - name: Open a pull request if the list changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git diff --quiet -- data README.md docs/papers.json; then
            branch="refresh-$(date -u +%Y-%m)"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git checkout -b "$branch"
            git add data README.md docs/papers.json
            git commit -m "Monthly refresh: preprints promoted or retired"
            git push origin "$branch"
            gh pr create --title "Monthly refresh $(date -u +%Y-%m)" --body-file refresh.log --base main --head "$branch"
          fi
      - name: Find new papers
        run: |
          git checkout -q main
          since=$(date -u -d '35 days ago' +%Y-%m-%d)
          python scripts/arxiv_sweep.py sweep_ti.json --since "$since"
          python scripts/arxiv_sweep.py sweep_abs.json --since "$since" --field abs
          python -c "import json; a=json.load(open('sweep_ti.json')); b=json.load(open('sweep_abs.json')); m={r['arxiv']: r for r in b}; m.update({r['arxiv']: r for r in a}); json.dump(list(m.values()), open('sweep.json','w'))"
          python scripts/new_candidates.py sweep.json > issue.md
      - name: Open an issue with the candidates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if grep -q '^- \[ \]' issue.md; then
            gh issue create --title "arXiv sweep $(date -u +%Y-%m)" --body-file issue.md
          fi
